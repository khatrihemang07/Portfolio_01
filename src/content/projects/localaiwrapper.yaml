name: localAIWrapper
pitch: Your CLI, pretending to be an API.
story:
  - "Point any OpenAI-compatible client at it and it answers like one. Behind the scenes each request starts one fresh CLI process, hands it your messages and returns the reply."
  - "It is a small bridge for trying AI tools from code you already have. No state is kept between requests, so every turn starts clean."
features:
  - "POST /v1/chat/completions in OpenAI's format"
  - "Three backends: claude, codex and commandcode"
  - "Model discovery on /v1/models"
  - "Tool calling rejected by default, optional emulation"
  - "Local only by default (127.0.0.1), no authentication"
  - "Configured with environment variables (PORT, WORKDIR_ROOTS, MAX_CONCURRENCY, TURN_TIMEOUT_MS)"
facts:
  - text: "1 process per request"
    source: "Verified 2026-11-07: the code comment says every Turn spawns a full CLI process, CONTEXT.md says Turns share no state, and one real request was run through the claude backend."
  - text: "Streaming and JSON-schema output"
    source: "Verified 2026-11-08 by real runs against the server on 127.0.0.1: a request with stream true returned server-sent chunks ending in a stop reason and [DONE], and a request with a json_schema response_format returned a JSON object matching the schema (language and strength). Both are also documented in the README."
  - text: "3 CLI backends"
    source: "Verified 2026-11-08 in the localAIWrapper README (the claude, codex or commandcode CLI) and in src/backends/index.ts, which registers exactly claude, codex and commandcode."
  - text: "OpenAI chat-completions format"
    source: "Verified 2026-11-07 by a real run: the JSON reply has object chat.completion, choices[0].message with role and content, finish_reason, and a usage block."
hood: "TypeScript on Bun. Every turn spawns a full CLI process with a timeout and a concurrency limit (PORT, WORKDIR_ROOTS, MAX_CONCURRENCY, TURN_TIMEOUT_MS)."
stack: TypeScript · Bun
repo: https://github.com/khatrihemang07/localAIWrapper
slides:
