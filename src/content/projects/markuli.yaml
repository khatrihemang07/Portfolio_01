name: markuli
pitch: Scribble on your screen, then make it vanish.
story:
  - "Press a hotkey and your whole screen becomes a whiteboard. Draw an arrow at the bug, circle the number in the chart, then press the hotkey again and everything is gone."
  - "Pointing at things on a screen shouldn't need a screen recorder or an app that takes five seconds to open. markuli opens in a blink, costs almost nothing while idle, and the ink is ported from Excalidraw's own drawing algorithm."
features:
  - "Five tools: Select, Pen, Eraser, Laser and Hand, each on one key"
  - "Five colours and three widths, with right-click pickers for the rest"
  - "Toolbar can sit on any of the four screen edges. Leave Draw Mode and your ink is still there when you come back."
  - "Copy your drawing as Excalidraw data with Cmd+C"
  - "Scroll the ink with the wheel or Option-drag"
facts:
  - text: "1.6 MB download"
    source: "Verified 2026-11-07: GitHub release v0.6.0 asset Markuli-0.6.0-macos-universal.dmg is 1,618,813 bytes (1.6 MB as Finder shows it, 1.54 MiB), sha256 28277af2c3dbf182757d4ba94e88e6c1698aa7e4f715c642aac0159896fc9fc9. The README says 1.5 MB, which only holds in binary units."
  - text: "11 MB idle RAM (Draw Mode off)"
    source: "Verified 2026-11-07 on the v0.6.0 release build (macOS, Apple silicon), idle with Draw Mode off: physical memory footprint 11 MB (macOS footprint tool, matching the Memory column in Activity Monitor). Resident size reads about 42 MB because it counts shared system libraries."
  - text: "0% idle CPU"
    source: "Verified 2026-11-07 on the v0.6.0 release build (macOS, Apple silicon), idle with Draw Mode off: 0.0% CPU in six top samples taken 3 s apart."
  - text: "5 tools · 5 colours · 3 widths"
    source: "Verified 2026-11-08 in the markuli README, Use section (/Users/mandalorian/Documents/Code/markuli/README.md): the key table lists five Tools (V Select, P Pen, E Eraser, K Laser, H Hand), keys 1 to 5 for five Colors (red, amber, green, blue, grape) and [ ] for three widths (thin 2 pt, medium 4 pt, bold 8 pt)."
hood: "Written in Rust with no webview, drawing straight onto a transparent overlay. A single hotkey toggles Draw Mode, so nothing runs in your way when you are not drawing."
stack: Rust · native macOS · no webview
