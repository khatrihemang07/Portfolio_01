    alt: "A terminal window showing the command bun run start and the server's startup line: localAIWrapper listening on http://127.0.0.1:8080, with a maximum concurrency of 4 and a turn timeout of 600000 milliseconds."
    caption: "Start it: one command, local address only"
  - image: ../../assets/projects/localaiwrapper/slide2.png
    alt: "A terminal window showing a curl request to the models endpoint and the model names it returns: claude-opus, claude-sonnet, claude-haiku, codex-sol, codex-terra and codex-luna."
    caption: "Ask what's available: /v1/models"
  - image: ../../assets/projects/localaiwrapper/slide3.png
    alt: "A terminal window showing a curl request to the chat completions endpoint asking for a two-sentence explanation of an embedding, and the OpenAI-style JSON reply with the explanation, a stop reason and token usage."
