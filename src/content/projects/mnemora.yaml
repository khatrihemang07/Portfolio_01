name: Mnemora
pitch: A journal and to-do app that never leaves your device.
story:
  - "Journal, Todo and an AI module live in one app with one look and one Settings page. Everything you write stays on your device, in a single SQLite file."
  - "Mnemora opens its Journal scrolled to today and works offline on Mac and Android. I develop it against a separate Sandbox build with fake data so real entries are never touched."
features:
  - "Journal: dated days, newest first, with timestamped entries"
  - "Todo module, plus an Android home-screen widget"
  - "AI module that answers from your own journal and tasks, using read-only tools, and shows which entries it used"
  - "Optional device-to-device Sync, no cloud or account: pair with a code and resolve conflicts yourself"
  - "One shell and Settings shared by every module"
facts:
  - text: "Mac + Android"
    source: "Verified 2026-11-07: release v0.2.2 ships both a macOS dmg (Mnemora-0.2.2-macos-aarch64.dmg) and an Android apk (Mnemora-0.2.2-android.apk); the README describes it as offline-first for desktop and Android."
  - text: "1 SQLite file holds everything"
    source: "Verified 2026-11-07 in the code: the app database path is a single mnemora.db file in the app data folder (core paths module), as the README states. Also observed: launching the v0.2.2 release app on an empty home folder created a single mnemora.db (plus its -wal and -shm journal files) in its data folder."
  - text: "6.4 MB Mac download"
    source: "Verified 2026-11-08: GitHub release v0.2.2 asset Mnemora-0.2.2-macos-aarch64.dmg is 6,415,569 bytes (6.4 MB as Finder shows it), read with gh release view. The release is Apple silicon only."
  - text: "Journal and Todo work offline, no account"
    source: "Verified 2026-11-08: the Mnemora README and GLOSSARY.md both describe it as offline-first with data on the device in one SQLite file, GLOSSARY.md says the optional Sync module works with no account or cloud service, and the source has no sign-in or account screen. The AI module needs a network connection to its chosen provider, so the claim is limited to Journal and Todo, which are local-only."
hood: "Rust core with a Tauri 2 shell and a TypeScript and Svelte interface. Modules are independent but share the shell, the theme and the one database file. For development there are separate Production and Sandbox builds, and the Sandbox is seeded with about three weeks of demo data."
stack: Rust · Tauri 2 · TypeScript
repo: https://github.com/khatrihemang07/Mnemora_v1
download: https://github.com/khatrihemang07/Mnemora_v1/releases/latest
